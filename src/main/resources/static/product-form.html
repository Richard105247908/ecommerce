<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Form</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          max-width: 500px;
          margin: 60px auto;
          background: #f7f7f7;
          color: #222;
        }
        h1 { margin-bottom: 20px; }
        label {
          display: block;
          margin-top: 14px;
          font-weight: bold;
          font-size: 14px;
        }
        input, textarea {
          width: 100%;
          padding: 8px;
          margin-top: 4px;
          box-sizing: border-box;
          font-size: 14px;
        }
        textarea { resize: vertical; min-height: 80px; }
        button {
          margin-top: 20px;
          padding: 10px 18px;
          background: #2b7de9;
          color: #fff;
          border: none;
          border-radius: 4px;
          font-size: 14px;
          cursor: pointer;
        }
        a.back-link {
          display: inline-block;
          margin-top: 16px;
          font-size: 14px;
        }
        #status { color: #d9534f; margin-top: 10px; }
    </style>
</head>
<body>

<h1 id="form-title">Add Product</h1>

<form id="product-form">

    <input type="hidden" id="productId">

    <label for="name">Name</label>
    <input type="text" id="name" required>

    <label for="price">Price</label>
    <input type="number" id="price" step="0.01" min="0" required>

    <label for="description">Description</label>
    <textarea id="description" required></textarea>

    <button type="submit">Save Product</button>
</form>

<p id="status"></p>
<a class="back-link" href="products.html">&larr; Back to product list</a>

<script>
    const API_URL = '/products/api';

    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('id');

    if (editId) {
      document.getElementById('form-title').textContent = 'Edit Product';
      document.getElementById('productId').value = editId;

      fetch(`${API_URL}/${editId}`)
        .then(response => {
          if (!response.ok) {
            throw new Error('Server responded with status ' + response.status);
          }
          return response.json();
        })
        .then(product => {
          document.getElementById('name').value = product.name;
          document.getElementById('price').value = product.price;
          document.getElementById('description').value = product.description;
        })
        .catch(error => {
          document.getElementById('status').textContent =
            'Could not load product: ' + error.message;
        });
    }

    document.getElementById('product-form').addEventListener('submit', function (event) {
      event.preventDefault(); // stop the browser from doing a normal page reload

      const product = {
        name: document.getElementById('name').value,
        price: parseFloat(document.getElementById('price').value),
        description: document.getElementById('description').value
      };

      const isEditing = editId !== null;
      const url = isEditing ? `${API_URL}/${editId}` : API_URL;
      const method = isEditing ? 'PUT' : 'POST';

      fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(product)
      })
        .then(response => {
          if (!response.ok) {
            throw new Error('Server responded with status ' + response.status);
          }
          return response.json();
        })
        .then(() => {
          // Success - go back to the list
          window.location.href = 'products.html';
        })
        .catch(error => {
          document.getElementById('status').textContent =
            'Could not save product: ' + error.message;
        });
    });
</script>

</body>
</html>
